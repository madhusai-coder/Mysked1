server:
  port: 8080

spring:
  application:
    name: mysked-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mysked_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:mysked_user}
    password: ${MYSQL_PASSWORD:mysked_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

mysked:
  jwt:
    secret: ${JWT_SECRET:change-this-256-bit-production-secret-key-for-mysked-student-planner}
    expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
